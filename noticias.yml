name: noticias
on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (el mínimo de GitHub)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Guardar estado
        run: |
          git config user.name "bot-noticias"
          git config user.email "bot-noticias@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
